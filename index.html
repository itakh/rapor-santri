<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapor Santri</title>
<meta name="theme-color" content="#1f3b16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js?v=c8df62fc"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --g9:#1f3b16;--g8:#2a4c1e;--g7:#33602a;--g6:#3e6f31;--g5:#5a8a47;--g2:#dfe9d6;--g1:#eef4e9;--g0:#f6f9f3;
  --or:#e07a1a;--or1:#fdf0e2;--au:#d6a72c;--au1:#fbf5e1;--rd:#c2410c;--rd1:#fdeae0;
  --ink:#1b2318;--ink2:#4a5545;--ink3:#7c8676;--line:#e3e7de;--line2:#d2d9cb;
  --bg:#f5f4ee;--card:#fff;--r:14px;--sh:0 1px 2px rgba(25,40,20,.05),0 4px 16px rgba(25,40,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.ar{font-family:"Scheherazade New",serif;direction:rtl;unicode-bidi:isolate;font-size:1.12em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g7)}
.hide{display:none!important}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:
 radial-gradient(1200px 600px at 10% -10%,#e7efdf 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#fbeedd 0,transparent 55%),var(--bg)}
.login-card{width:min(880px,100%);display:grid;grid-template-columns:1.05fr 1fr;background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(30,50,20,.14);overflow:hidden}
.login-brand{background:linear-gradient(155deg,var(--g8),var(--g9));color:#fff;padding:40px 36px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:440px}
.login-brand::after{content:"";position:absolute;right:-90px;bottom:-90px;width:280px;height:280px;border-radius:50%;border:40px solid rgba(214,167,44,.16)}
.login-brand .lg{width:74px;height:74px;border-radius:18px;background:#fff;padding:6px}
.login-brand h1{font-size:26px;line-height:1.2;margin:22px 0 6px;font-weight:800;letter-spacing:-.3px}
.login-brand .ar{font-size:24px;color:#f4dc9a;display:block}
.login-brand p{color:#cfe0c4;margin:14px 0 0;line-height:1.6;max-width:320px}
.login-brand .ver{font-size:12px;color:#9fb994}
.login-form{padding:44px 38px}
.login-form h2{margin:0 0 4px;font-size:22px}
.login-form .sub{color:var(--ink3);margin:0 0 26px}
@media(max-width:760px){.login-card{grid-template-columns:1fr}.login-brand{min-height:0;padding:28px}.login-brand p{display:none}.login-form{padding:28px}}

/* ---------- form ---------- */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.f small{color:var(--ink3);font-size:12px}
.in{width:100%;border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:.15s}
.in:focus{border-color:var(--g5);box-shadow:0 0 0 4px rgba(90,138,71,.14)}
.in.ar{font-size:18px;padding:6px 12px}
select.in{appearance:none;-webkit-appearance:none;background-color:#fff;background-image:linear-gradient(45deg,transparent 50%,#7c8676 50%),linear-gradient(135deg,#7c8676 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-weight:500}
.sw{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--g6)}.sw:checked::after{left:19px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn-p{background:var(--g7);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 2px 6px rgba(51,96,42,.25)}
.btn-p:hover{background:var(--g8)}
.btn-s{background:#fff;color:var(--ink);border:1.5px solid var(--line2)}
.btn-s:hover{border-color:var(--g5);color:var(--g8)}
.btn-g{background:transparent;color:var(--ink2)}.btn-g:hover{background:var(--g1);color:var(--g8)}
.btn-d{background:var(--rd1);color:var(--rd)}.btn-d:hover{background:#fbd6c4}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn-w{width:100%;padding:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100%}
.scrim{display:none}
.side{background:linear-gradient(180deg,var(--g8),var(--g9));color:#e6efe0;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .brand{display:flex;gap:12px;align-items:center;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.side .brand img{width:44px;height:44px;border-radius:12px;background:#fff;padding:3px}
.side .brand b{display:block;font-size:15px;color:#fff;line-height:1.2}
.side .brand span{font-size:12px;color:#a9c29c}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav .sec{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#8fae80;padding:14px 12px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#dbe7d3;text-decoration:none;font-weight:500;cursor:pointer}
.nav a svg{width:19px;height:19px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--au)}
.side .me{display:flex;gap:10px;align-items:center;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.08)}
.av{width:36px;height:36px;border-radius:50%;background:var(--au);color:var(--g9);display:grid;place-items:center;font-weight:800;flex:none}
.side .me b{font-size:13px;display:block;color:#fff;line-height:1.2}
.side .me span{font-size:11.5px;color:#a9c29c}
.main{min-width:0}
.top{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:28px 30px 60px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{margin:0;font-size:24px;letter-spacing:-.3px}
.ph p{margin:4px 0 0;color:var(--ink3)}
.ph .act{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-102%);transition:.25s}
  .side.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.25)}
  .side.drag{transition:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:59;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;background:rgba(245,244,238,.9);backdrop-filter:blur(8px);padding:10px 14px;border-bottom:1px solid var(--line)}
  .top img{width:32px;height:32px;border-radius:8px}
  .top b{font-size:15px}
  .wrap{padding:18px 14px 60px}
  .ph h1{font-size:20px}
}

/* ---------- card & table ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15.5px}
.card-b{padding:16px 18px}
.tw{overflow:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0}
.t th{position:sticky;top:0;background:var(--g0);text-align:left;font-size:12px;font-weight:700;color:var(--ink2);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:#fafcf8}
.t .sub{display:block;color:var(--ink3);font-size:12.5px}
.t .ar.sub{font-size:15px;color:var(--ink2);text-align:left}
.num{font-variant-numeric:tabular-nums;color:var(--ink3);width:44px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--g1);color:var(--g8);white-space:nowrap;margin:1px 2px 1px 0}
.pill.or{background:var(--or1);color:#9a4d0a}.pill.au{background:var(--au1);color:#7a5c0c}.pill.rd{background:var(--rd1);color:var(--rd)}.pill.gy{background:#eef0ec;color:var(--ink2)}
.empty{padding:36px;text-align:center;color:var(--ink3)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;color:var(--ink3)}
.search .in{padding-left:38px}
.seg{display:flex;gap:4px;background:var(--g0);border:1px solid var(--line);padding:3px;border-radius:11px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--g8);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:16px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;letter-spacing:-.5px;color:var(--g8)}
.stat{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stat .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--g1);color:var(--g7);box-shadow:inset 0 0 0 1px rgba(62,111,49,.08)}
.stat .si svg{width:19px;height:19px}
.stat .si.au{background:var(--au1);color:#a37c12}.stat .si.or{background:var(--or1);color:var(--or)}.stat .si.bl{background:#e9eff9;color:#3a64a8}
.stat span{font-size:12.5px;color:var(--ink3);font-weight:600}
.hero{border-radius:18px;padding:24px 26px;color:#fff;background:linear-gradient(120deg,var(--g8),var(--g6));position:relative;overflow:hidden;margin-bottom:18px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(214,167,44,.35),transparent 70%)}
.hero h2{margin:0;font-size:22px;letter-spacing:-.2px}
.hero p{margin:6px 0 0;color:#d6e6cc}
.hero .cd{position:relative;text-align:right}
.hero .cd b{font-size:38px;line-height:1;display:block}
.hero .cd span{font-size:12.5px;color:#d6e6cc}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.cols.c2{grid-template-columns:1fr 1fr}.cols.c16{grid-template-columns:1fr 1.6fr}
@media(max-width:960px){.cols,.cols.c2,.cols.c16{grid-template-columns:1fr}}
.task{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--g1);color:var(--g7);flex:none}
.ic svg{width:20px;height:20px}
.ic.or{background:var(--or1);color:var(--or)}.ic.au{background:var(--au1);color:#a37c12}.ic.bl{background:#e6eefb;color:#2f5ea8}
.task b{display:block}
.task .meta{color:var(--ink3);font-size:13px;margin-top:2px}
.issue{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--or)}
.dot.ok{background:var(--g5)}.dot.rd{background:var(--rd)}
.issue .meta{color:var(--ink3);font-size:12.5px;margin-top:2px;line-height:1.5}

.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gc{padding:16px 18px;cursor:pointer;transition:.15s}
.gc:hover{border-color:var(--g5);transform:translateY(-1px)}
.gc .n{font-weight:700;font-size:15px}
.gc .m{color:var(--ink3);font-size:13px;margin-top:3px}
.gc .c{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.gc .c b{font-size:22px;color:var(--g8)}
.bar{height:6px;background:var(--g1);border-radius:9px;overflow:hidden;flex:1;margin-left:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g5),var(--au));border-radius:9px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,30,15,.45);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto;animation:fd .15s}
.md{background:#fff;border-radius:18px;width:min(560px,100%);box-shadow:0 30px 80px rgba(0,0,0,.25);animation:up .18s}
.md.lg{width:min(860px,100%)}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.md-h h3{margin:0;font-size:17px}
.md-b{padding:20px 22px}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--g0);border-radius:0 0 18px 18px;flex-wrap:wrap}
.md-f .sp{flex:1}
.x{border:0;background:transparent;cursor:pointer;color:var(--ink3);padding:6px;border-radius:8px}
.x:hover{background:var(--g1)}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(12px);opacity:0}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast div{background:var(--g9);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-weight:500;animation:up .2s;max-width:90vw}
.toast div.err{background:var(--rd)}
.load{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(245,244,238,.55)}
.spin{width:38px;height:38px;border-radius:50%;border:3.5px solid var(--g2);border-top-color:var(--g7);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{min-height:100%;display:grid;place-items:center;text-align:center;color:var(--ink3)}
.boot img{width:84px;border-radius:20px;margin-bottom:16px;box-shadow:var(--sh)}
.note{background:var(--au1);border:1px solid #efdfae;color:#6b520d;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.55}
.note.g{background:var(--g0);border-color:var(--g2);color:var(--g8)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
textarea.in{min-height:170px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre}
.mlist{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .grow{flex:1;min-width:0}
.mrow .sub{color:var(--ink3);font-size:12px}
.plist{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}.prow:hover{background:var(--g0)}
.prow .nm{flex:1;min-width:0;font-weight:600;font-size:13px}.prow .nm span{color:var(--ink3);font-weight:500;white-space:nowrap}
.prow .bar{max-width:120px;margin-left:0}.prow .ct{font-size:12px;color:var(--ink3);width:52px;text-align:right;font-variant-numeric:tabular-nums}
.gt{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.gt th{position:sticky;top:0;z-index:2;background:var(--g0);font-size:11.5px;font-weight:700;color:var(--ink2);padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.gt td{border-bottom:1px solid var(--line);padding:3px 4px;text-align:center;white-space:nowrap}
.gt .nmc{position:sticky;left:0;z-index:1;background:#fff;text-align:left;padding:6px 12px;min-width:190px;max-width:260px;white-space:normal;line-height:1.25}
.gt th.nmc{z-index:3;background:var(--g0)}
.gt tr:hover td{background:#fbfcfa}.gt tr:hover .nmc{background:#fbfcfa}
.gt th.grp{background:var(--g1);color:var(--g8)}
.gi{width:54px;padding:7px 2px;border:1.5px solid transparent;border-radius:8px;text-align:center;background:#f6f8f3;outline:none;font-variant-numeric:tabular-nums}
.gi:hover{border-color:var(--line2)}.gi:focus{border-color:var(--g5);background:#fff;box-shadow:0 0 0 3px rgba(90,138,71,.15)}
.gi.bad{border-color:var(--rd);background:var(--rd1);color:var(--rd)}
.xc{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 4px}.xc:hover{color:var(--rd)}
.gi.ad{width:42px;font-weight:700;text-transform:uppercase}
.dv{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:46px;display:inline-block}
.na{font-weight:800;font-size:14px;min-width:46px;display:inline-block}
.na.lo{color:var(--rd)}.na.inc{color:var(--ink3);font-weight:600}
.na sup{font-size:10px;color:var(--or);margin-left:1px}
.st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line2);vertical-align:middle}
.st-dot.ok{background:var(--g5)}.st-dot.half{background:var(--au)}
.save-st{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.save-st.dirty{color:var(--or);font-weight:600}
@media(max-width:620px){.gt .nmc{min-width:120px;max-width:140px;font-size:12.5px;padding:6px 8px}.gi{width:48px}}
.rk th{white-space:normal;line-height:1.2;min-width:44px;padding:8px 4px}.rk .nmc{min-width:160px}
.rk td{text-align:center}.rk .lo{color:var(--rd);font-weight:700}.rk .inc{color:var(--ink3);font-style:italic}
.rk tfoot td{background:var(--g0);font-weight:700;border-top:1.5px solid var(--line2)}
#cetak .page{width:210mm;height:297mm;background:#fff;position:relative;padding:9mm 13mm 9mm;overflow:hidden;font-size:10pt;line-height:1.25}
#cetak .page>*{position:relative}
#cetak .kop{display:grid;grid-template-columns:22mm 1fr 22mm;align-items:center;gap:4mm}
#cetak .kop img{width:22mm;height:22mm;object-fit:contain}
#cetak .kop .c{text-align:center}
#cetak .kop .t-ar{font-family:"Scheherazade New",serif;font-size:15pt;font-weight:700;line-height:1.2;color:#000}

  if(r&&r.relogin){store.del('rts_token');S.token=null;renderLogin();return rej(new Error('relogin'))}
  const m=(r&&r.error)||'Terjadi kesalahan.';toast(m,true);rej(new Error(m))}

function call(action,data,{silent}={}){
  return new Promise((res,rej)=>{
    if(!silent)loading(true);
    const req={action,token:S.token,data};
    if(LEWAT_GAS){google.script.run.withSuccessHandler(r=>jawab(r,silent,res,rej)).withFailureHandler(e=>gagal(e,silent,rej)).api(req);return}
    const url=window.API_URL||'';
    if(!url)return gagal(new Error('Alamat server (API_URL) belum diisi di config.js'),silent,rej);
    fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req),redirect:'follow'})
      .then(x=>{if(!x.ok)throw new Error('server menjawab '+x.status);return x.json()})
      .then(r=>jawab(r,silent,res,rej))
      .catch(e=>gagal(e,silent,rej));

}

  const nisn={};sa.forEach(s=>{if(s.nisn)(nisn[s.nisn]=nisn[s.nisn]||[]).push(s.nama)});
  const dob=Object.entries(nisn).filter(([k,v])=>v.length>1);
  if(dob.length)out.push({t:`${dob.length} NISN dipakai lebih dari satu santri`,m:dob.map(([k,v])=>`${k}: ${v.join(' & ')}`).join(' · '),p:'santri',f:'nisn',lvl:'rd'});
  const pj=sa.filter(s=>s.nisn&&!/^\d{10}$/.test(s.nisn));
  if(pj.length)out.push({t:`${pj.length} NISN tidak 10 digit`,m:pj.map(s=>`${s.nama} (${s.nisn})`).join(', '),p:'santri',f:'nisn'});
  const tH=sa.filter(s=>!s.halaqahId),tA=sa.filter(s=>!s.asramaId);
  if(tH.length)out.push({t:`${tH.length} santri belum masuk halaqah`,m:tH.map(s=>s.nama).join(', '),p:'halaqah',lvl:'rd'});
  if(tA.length)out.push({t:`${tA.length} santri belum masuk asrama`,m:tA.map(s=>s.nama).join(', '),p:'asrama',lvl:'rd'});
  const uAr=d.ustadz.filter(u=>u.aktif&&!u.namaAr);
  if(uAr.length)out.push({t:`${uAr.length} ustadz belum punya nama Arab`,m:uAr.map(u=>u.nama).join(', ')+' — dibutuhkan bila beliau wali kelas/musyrif.',p:'ustadz'});
  const kw=d.kelas.filter(k=>!k.waliId);
  if(kw.length)out.push({t:`${kw.length} kelas belum punya wali`,m:kw.map(k=>k.nama).join(', '),p:'kelas',lvl:'rd'});
  return out;
}

function imporSantri(){
  const m=modal({lg:1,title:'Impor santri dari Excel',body:`
   <div class="note g" style="margin-bottom:14px">Salin baris dari Excel/Google Sheet lalu tempel di bawah. Baris pertama boleh berisi judul kolom
   (<b>Nama, Nama Arab, NISN, NIS, Kelas, Halaqah, Asrama, Panggilan</b>). Tanpa judul, urutan kolom dianggap seperti itu.
   Santri yang sudah ada (NIS atau nama sama) akan <b>diperbarui</b>, sisanya ditambahkan. Kolom kosong tidak menimpa data lama.</div>
   <textarea class="in" id="tx" placeholder="Nama&#9;Nama Arab&#9;NISN&#9;NIS&#9;Kelas&#9;Halaqah&#9;Asrama"></textarea>
   <div id="pv" style="margin-top:14px"></div>`,
   foot:`<span class="sp"></span><button class="btn btn-s" data-c>Tutup</button><button class="btn btn-s" data-p>Periksa</button><button class="btn btn-p" data-s disabled>Simpan</button>`});
  let baris=[];
  const parse=()=>{
    const lines=$('#tx',m.ov).value.replace(/\r/g,'').split('\n').filter(l=>l.trim());
    if(!lines.length)return [];
    const kol=['nama','namaAr','nisn','nis','kelas','halaqah','asrama','panggilan'];
    const alias={nama:/^(nama( santri| lengkap)?|name)$/,namaAr:/arab|عرب|اسم/,nisn:/^nisn$/,nis:/^nis$/,kelas:/kelas|jenjang/,halaqah:/halaqah|halaqoh|musyrif halaqah/,asrama:/asrama/,panggilan:/panggil/};
    let map=kol, first=lines[0].split('\t').map(x=>x.trim().toLowerCase());
    let hdr=first.some(x=>/^nama/.test(x));
    if(hdr)map=first.map(h=>Object.keys(alias).find(k=>alias[k].test(h))||null);
    return lines.slice(hdr?1:0).map(l=>{const c=l.split('\t'),o={};map.forEach((k,i)=>{if(k&&c[i]!==undefined&&c[i].trim()!=='')o[k]=c[i].trim()});
      if(o.nisn&&o.nisn.indexOf('/')>=0&&!o.nis){const p=o.nisn.split('/');o.nisn=p[0].trim();o.nis=(p[1]||'').trim()}return o});
  };
  $('[data-c]',m.ov).onclick=m.close;
  $('[data-p]',m.ov).onclick=async()=>{baris=parse();if(!baris.length)return toast('Belum ada data yang ditempel.',true);
    try{const r=await call('imporSantri',{baris,simpan:false});
      const n={baru:0,perbarui:0,galat:0,lewati:0};r.pratinjau.forEach(x=>n[x.status]++);
      $('#pv',m.ov).innerHTML=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap"><span class="pill">${n.baru} baru</span><span class="pill au">${n.perbarui} diperbarui</span>${n.galat?`<span class="pill rd">${n.galat} galat</span>`:''}${n.lewati?`<span class="pill gy">${n.lewati} dilewati</span>`:''}</div>
       <div class="mlist"><table class="t"><thead><tr><th>#</th><th>Nama</th><th>Status</th><th>Catatan</th></tr></thead><tbody>${r.pratinjau.map(x=>`<tr><td class="num">${x.no}</td><td>${esc(x.nama)}</td><td><span class="pill ${x.status==='baru'?'':x.status==='perbarui'?'au':x.status==='galat'?'rd':'gy'}">${x.status}</span></td><td style="color:var(--ink3);font-size:12.5px">${esc(x.pesan)}</td></tr>`).join('')}</tbody></table></div>`;
      $('[data-s]',m.ov).disabled=!(n.baru+n.perbarui);}catch(_){}};
  $('[data-s]',m.ov).onclick=async()=>{try{const r=await call('imporSantri',{baris,simpan:true});terapkan(r);m.close();toast(`Impor selesai: ${r.baru} baru, ${r.ubah} diperbarui.`);ulang()}catch(_){}};
}


function peranUstadz(id){
  const d=S.d,x=[],u=U(id);
  if(u.isAdmin)x.push('<span class="pill au">Admin</span>');
  if(u.isMudir)x.push('<span class="pill au">Mudir</span>');if(u.isKesantrian)x.push('<span class="pill au">Kepala Kesantrian</span>');if(u.isPenguji)x.push('<span class="pill">Penguji</span>');
  d.kelas.filter(k=>k.waliId===id).forEach(k=>x.push(`<span class="pill">Wali ${k.tingkat}</span>`));
  const n=d.pengampuan.filter(p=>p.ustadzId===id).length;if(n)x.push(`<span class="pill or">${n} mapel</span>`);
  if(d.halaqah.some(h=>h.musyrifId===id))x.push('<span class="pill">Halaqah</span>');
  d.asrama.filter(a=>a.musyrifId===id).forEach(a=>x.push(`<span class="pill gy">${esc(a.nama.replace(/ (bin|Ash-Shiddiq).*?(\d)$/,' $2'))}</span>`));
  return x.join('');
}

const BOBOT=()=>{const st=S.d.pengaturan;return {t:+st.bobotTugas,p:+st.bobotPTS,a:+st.bobotPAS,kkm:+st.kkm,kat:+st.batasKatrol}};
const bulat=x=>Math.round(x+1e-9);
const num=v=>{v=String(v==null?'':v).trim().replace(',','.');if(v==='')return null;const n=Number(v);return isNaN(n)||n<0||n>100?NaN:n};
const parseTugas=t=>String(t||'')===''?[]:String(t).split(';');
const fmt1=x=>x==null?'':(Math.round(x*10)/10).toString().replace('.',',');
function hitungNA(r){
  const b=BOBOT();const t=(r.tugas||[]).map(num).filter(x=>x!==null&&!isNaN(x));
  const pts=num(r.pts),pas=num(r.pas),parts=[];
  const rt=t.length?t.reduce((a,c)=>a+c,0)/t.length:null;
  if(rt!==null)parts.push([rt,b.t]);if(pts!==null&&!isNaN(pts))parts.push([pts,b.p]);if(pas!==null&&!isNaN(pas))parts.push([pas,b.a]);
  if(!parts.length)return {rt:null,na:null,isi:!!r.adab};
  const w=parts.reduce((a,c)=>a+c[1],0)||1;const na=parts.reduce((a,c)=>a+c[0]*c[1],0)/w;
  const nb=bulat(na),katrol=nb<b.kat;
  return {rt,na,nb,rapor:katrol?b.kat:nb,katrol,isi:true,lengkap:parts.length===3&&!!r.adab};
}
function urutPengampuan(arr){return [...arr].filter(Boolean).sort((a,b)=>(K(a.kelasId).tingkat-K(b.kelasId).tingkat)||((+M(a.mapelId).urutan||0)-(+M(b.mapelId).urutan||0)))}
function barisProgres(p){const g=(S.d.progres||{})[p.id]||{n:0,isi:0,lengkap:0};const pc=g.n?Math.round(g.lengkap/g.n*100):0;
  return `<div class="prow" data-isi="${p.id}"><div class="nm">${esc(M(p.mapelId).nama)} <span>· ${esc(K(p.kelasId).nama)}</span></div><div class="bar"><i style="width:${pc}%"></i></div><div class="ct">${g.lengkap}/${g.n}</div><button class="btn btn-s btn-sm">Isi</button></div>`}
function kartuKesantrian(){
  const hq=[...S.d.halaqah].sort((a,b)=>a.nama.localeCompare(b.nama)),as=[...S.d.asrama];
  return `<div class="card" style="margin-top:18px"><div class="card-h"><h3>Pantauan kesantrian</h3><span style="color:var(--ink3);font-size:12.5px">Lengkap = semua isian santri terisi</span></div>
   <div class="sec-t" style="margin:12px 16px 4px">Halaqah tahfizh</div><div>${hq.map(h=>barisProgres2('tahfizh',h.id,esc(h.nama)+' <span>· '+esc(ust(h.musyrifId))+'</span>')).join('')}</div>
   <div class="sec-t" style="margin:12px 16px 4px">Keasramaan</div><div style="padding-bottom:6px">${as.map(a=>barisProgres2('asrama',a.id,esc(a.nama)+' <span>· '+esc(ust(a.musyrifId))+'</span>')).join('')}</div></div>`}
function kartuProgres(){
  const pr=S.d.progres||{};
  const rows=kelasUrut().map(k=>{const ps=S.d.pengampuan.filter(p=>p.kelasId===k.id);let n=0,l=0,mapelSelesai=0;

async function simpanGrid(){

function imporNilai(){
  const g=G;
  const m=modal({lg:1,title:'Impor nilai dari Excel',body:`
   <div class="note g" style="margin-bottom:14px">Salin tabel nilai dari Excel <b>beserta baris judulnya</b>, lalu tempel di bawah. Judul kolom yang dikenali:
   <b>Nama</b> (wajib), <b>Tugas 1, Tugas 2 …</b> (atau T1, H1, UH1), <b>PTS</b>/UTS, <b>PAS</b>/UAS/PAT, <b>Adab</b>. Santri dicocokkan berdasarkan nama.
   Hasilnya masuk ke tabel dulu — periksa, lalu tekan <b>Simpan</b>.</div>
   <textarea class="in" id="tx" placeholder="Nama&#9;Tugas 1&#9;Tugas 2&#9;PTS&#9;PAS&#9;Adab"></textarea><div id="pv" style="margin-top:12px"></div>`,
   foot:`<span class="sp"></span><button class="btn btn-s" data-c>Batal</button><button class="btn btn-s" data-p>Periksa</button><button class="btn btn-p" data-s disabled>Masukkan ke tabel</button>`});
  let hasil=null;
  const norm=x=>String(x||'').toLowerCase().replace(/^(muhammad|muhamad|moh\.?|m\.)\s+/,'').replace(/[^a-z]/g,'');
  const cari=nama=>{const q=norm(nama);if(!q)return null;
    let hit=g.rows.filter(x=>norm(x.s.nama)===q);if(hit.length===1)return hit[0];
    hit=g.rows.filter(x=>{const n=norm(x.s.nama);return n.indexOf(q)===0||q.indexOf(n)===0});if(hit.length===1)return hit[0];
    hit=g.rows.filter(x=>{const n=norm(x.s.nama);return n.indexOf(q)>=0||q.indexOf(n)>=0});return hit.length===1?hit[0]:null};
  const periksa=()=>{
    const lines=$('#tx',m.ov).value.replace(/\r/g,'').split('\n').filter(l=>l.trim());
    if(lines.length<2)return toast('Tempel minimal baris judul dan satu baris nilai.',true);
    const h=lines[0].split('\t').map(x=>x.trim().toLowerCase());
    const iNama=h.findIndex(x=>/nama/.test(x));if(iNama<0)return toast('Kolom "Nama" tidak ditemukan di baris judul.',true);
    const iT=[],map={};h.forEach((x,i)=>{if(i===iNama)return;
      if(/^(pts|uts)|tengah semester/.test(x))map.pts=i;else if(/^(pas|uas|pat|sas)|akhir semester|akhir tahun/.test(x))map.pas=i;
      else if(/adab|akhlak|sikap/.test(x))map.adab=i;else if(/tugas|harian|^(t|h|uh|nh)\s*\d+$/.test(x))iT.push(i)});
    const cocok=[],gagal=[];

      cocok.push({r,tugas:iT.map(i=>(c[i]||'').trim()),pts:map.pts!=null?(c[map.pts]||'').trim():null,pas:map.pas!=null?(c[map.pas]||'').trim():null,adab:map.adab!=null?(c[map.adab]||'').trim().toUpperCase():null})});
    hasil={cocok,nT:iT.length};
    $('#pv',m.ov).innerHTML=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="pill">${cocok.length} santri cocok</span>${gagal.length?`<span class="pill rd">${gagal.length} tidak ditemukan</span>`:''}
      <span class="pill gy">${iT.length} kolom tugas${map.pts!=null?' · PTS':''}${map.pas!=null?' · PAS':''}${map.adab!=null?' · Adab':''}</span></div>
      ${gagal.length?`<div class="note">Tidak ditemukan di kelas ini: ${esc(gagal.join(', '))}. Periksa ejaan nama, atau isi manual.</div>`:''}`;
    $('[data-s]',m.ov).disabled=!cocok.length;
  };
  $('[data-c]',m.ov).onclick=m.close;$('[data-p]',m.ov).onclick=periksa;
  $('[data-s]',m.ov).onclick=()=>{if(!hasil)return;
    if(hasil.nT>g.nT){const tambah=hasil.nT-g.nT;g.nT=hasil.nT;g.rows.forEach(x=>{for(let i=0;i<tambah;i++)x.tugas.push('')})}

}

function hitungKelas(kid,r){
  const ps=urutPengampuan(S.d.pengampuan.filter(p=>p.kelasId===kid));
  const santri=santriAktif().filter(s=>s.kelasId===kid).sort((a,c)=>a.nama.localeCompare(c.nama));
  const map={};r.rows.forEach(x=>map[x.pengampuanId+'|'+x.santriId]=x);
  const th={};(r.tahfizh||[]).forEach(x=>th[x.santriId]=x);
  const wl={};(r.wali||[]).forEach(x=>wl[x.santriId]=x);
  const kol={};ps.forEach(p=>kol[p.id]=[]);const kolH=[];
  const data=santri.map(s=>{
    const sel=ps.map(p=>{const x=map[p.id+'|'+s.id];if(!x)return null;const h=hitungNA({tugas:parseTugas(x.tugas),pts:x.pts,pas:x.pas,adab:x.adab});h.adab=x.adab;return h});
    sel.forEach((h,i)=>{if(h&&h.na!=null)kol[ps[i].id].push(h.rapor)});
    const t=th[s.id]?hitungTahfizh(parseJuz(th[s.id].juz)):null;const hafalan=t&&t.rata!=null?bulat(t.rata):null;
    if(hafalan!=null)kolH.push(hafalan);
    const vals=sel.filter(h=>h&&h.na!=null).map(h=>h.rapor).concat(hafalan!=null?[hafalan]:[]);
    const ad=sel.filter(h=>h&&h.adab).map(h=>NHUR[h.adab]);
    return {s,sel,hafalan,jumlah:vals.reduce((a,c)=>a+c,0),n:vals.length,rata:vals.length?vals.reduce((a,c)=>a+c,0)/vals.length:null,
      adab:ad.length?hurufRata(ad.reduce((a,c)=>a+c,0)/ad.length):'',nAdab:ad.length,wali:wl[s.id]||{},
      mapel:sel.map((h,i)=>({nama:M(ps[i].mapelId).nama,rapor:h&&h.na!=null?h.rapor:null}))}});
  const urut=data.filter(x=>x.rata!=null).map(x=>Math.round(x.rata*100)/100).sort((a,c)=>c-a);
  data.forEach(x=>{x.rank=x.rata==null?null:urut.indexOf(Math.round(x.rata*100)/100)+1});
  return {ps,santri,data,kol,kolH};
}

function ujianSantri(s,pilih){
  const me=S.d.me,hq=H(s.halaqahId);
  const daftar=()=>parseJuz(UJ.juz[s.id]);
  const kosong=()=>{const ada=daftar().map(j=>+j.juz);let c=30;while(ada.includes(c)&&c>1)c--;return {juz:ada.includes(c)?'':String(c),hafalan:'',tilawah:'',halaman:'20'}};
  let f=kosong(),edit=null;
  if(pilih){const e=daftar().find(j=>+j.juz===+pilih);if(e){f=Object.assign({},e);edit=+e.juz}}
  const m=modal({title:esc(s.nama)+` <span style="color:var(--ink3);font-weight:500;font-size:13px">${HP()?'':'· '}${esc(K(s.kelasId).nama||'')}</span>`,body:`
    <div class="ujinfo">${ic('quran')}<span>${s.halaqahId?esc(hq.nama)+(hq.musyrifId&&!hq.nama.includes(String(U(hq.musyrifId).nama||'').split(' ')[0])?' · Musyrif: '+esc(ust(hq.musyrifId)):''):'Belum masuk halaqah'}</span></div>
    <div class="ujh">Juz yang sudah tercatat</div><div class="ujchips" id="ujch"></div>
    <div class="ujh" id="ujt">Nilai ujian</div>
    <div class="ujf"><div class="ujrow"><label class="ujjuz">Juz<input id="uj_juz" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      <div class="ujna"><small>Nilai juz</small><b id="uj_na">—</b><em id="uj_pr"></em></div></div>
      <div class="ujin"><label>Hafalan<input class="in" id="uj_haf" inputmode="decimal" placeholder="0–100" enterkeyhint="next"></label><label>Tilawah<input class="in" id="uj_til" inputmode="decimal" placeholder="0–100" enterkeyhint="done"></label></div>
      <div class="ujft"><span>Halaman diujikan</span><div class="step"><button type="button" data-st="-1" aria-label="Kurangi halaman">−</button><span id="uj_hal"></span><button type="button" data-st="1" aria-label="Tambah halaman">+</button></div></div></div>
    <div id="ujw"></div>`,
    foot:`<button class="btn btn-d" data-h style="display:none">${ic('trash')}Hapus</button><span class="sp"></span><button class="btn btn-s" data-c>Tutup</button><button class="btn btn-p" data-s>${ic('save')}<span>Simpan</span></button>`});
  const ov=m.ov,$o=x=>$(x,ov);
  const lama=()=>{const n=+f.juz;return n?daftar().find(j=>+j.juz===n):null};
  const chips=()=>{const ls=daftar();
    $o('#ujch').innerHTML=ls.map(j=>{const n=hitungTahfizh([j]).rows[0].akhir,mine=j.penguji===me.id;const oleh=j.penguji?(mine?'Antum':namaPendek(U(j.penguji).nama)):(hq.musyrifId?namaPendek(U(hq.musyrifId).nama):'musyrif');
      return `<button type="button" class="ujc ${mine?'mine':''} ${edit===+j.juz?'on':''}" data-j="${esc(j.juz)}"><b>Juz ${esc(j.juz)}<i>${n!=null?fmt1(n):'—'}</i></b><span>${esc(oleh)}</span></button>`}).join('')+
      `<button type="button" class="ujc baru ${edit===null?'on':''}" data-j="">${ic('plus')}Juz baru</button>`;
    $$('#ujch [data-j]',ov).forEach(b=>b.onclick=()=>{const j=b.dataset.j;if(!j){f=kosong();edit=null}else{f=Object.assign({},daftar().find(x=>x.juz===j));edit=+j}isi();chips();
      setTimeout(()=>{const t=j?$o('#uj_haf'):$o('#uj_juz');t.focus();if(t.select)t.select()},30)})};
  const isi=()=>{$o('#uj_juz').value=f.juz;$o('#uj_haf').value=f.hafalan;$o('#uj_til').value=f.tilawah;segar()};
  const segar=()=>{
    const hal=Math.max(5,Math.min(20,+f.halaman||20));f.halaman=String(hal);$o('#uj_hal').textContent=hal>=20?'20 · utuh':hal+' hlm';
    const r=hitungTahfizh([f]).rows[0];$o('#uj_na').textContent=r.akhir!=null?fmt1(r.akhir):'—';$o('#uj_pr').textContent=r.akhir!=null?predikatNilai(r.akhir)[0]:'';
    const v=f.juz.trim(),n=+v,salah=v!==''&&!(n>=1&&n<=30&&Math.floor(n)===n);
    $o('#uj_juz').classList.toggle('bad',salah);
    ['haf','til'].forEach(k=>{const el=$o('#uj_'+k),x=num(el.value);el.classList.toggle('bad',el.value.trim()!==''&&(x==null||Number.isNaN(x)||x<0||x>100))});
    const l=salah?null:lama(),mine=l&&l.penguji===me.id;
    let w='';
    if(salah)w='<div class="note">Nomor juz harus 1–30.</div>';
    else if(l&&edit!==+l.juz){const ln=hitungTahfizh([l]).rows[0].akhir;w=`<div class="note">Juz ${n} sudah tercatat dengan nilai <b>${ln!=null?fmt1(ln):'—'}</b> (${l.penguji?(mine?'ujian Antum':'diuji '+esc(namaPendek(U(l.penguji).nama))):'diisi musyrif halaqah'}). Satu juz hanya boleh satu nilai — jika disimpan, nilai lama <b>diganti</b>.</div>`}
    $o('#ujw').innerHTML=w;
    $o('#ujt').textContent=l?'Perbarui nilai juz '+n:'Nilai ujian baru';
    $('[data-s] span',ov).textContent=l?'Perbarui':'Simpan';
    const bh=$('[data-h]',ov);bh.style.display=l&&edit===+l.juz&&(mine||me.isAdmin)?'':'none';
  };
  $o('#uj_juz').oninput=e=>{f.juz=e.target.value.replace(/[^0-9]/g,'');e.target.value=f.juz;if(edit!==null&&+f.juz!==edit)edit=null;chips();segar()};
  $o('#uj_haf').oninput=e=>{f.hafalan=e.target.value;segar()};$o('#uj_til').oninput=e=>{f.tilawah=e.target.value;segar()};
  $o('#uj_haf').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$o('#uj_til').focus()}};
  $o('#uj_til').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('[data-s]',ov).click()}};
  $$('.ujft [data-st]',ov).forEach(b=>b.onclick=()=>{f.halaman=String(Math.max(5,Math.min(20,(+f.halaman||20)+(+b.dataset.st))));segar()});
  $('[data-c]',ov).onclick=m.close;
  const kirim=async d=>{const r=await call('simpanUjian',Object.assign({santriId:s.id},d));if(r.progres2)S.d.progres2=r.progres2;if(r.juz!==undefined)UJ.juz[s.id]=r.juz;return r};
  $('[data-s]',ov).onclick=async()=>{
    segar();if($('.ujf .bad',ov))return toast('Periksa isian yang ditandai merah.',true);
    if(!f.juz)return toast('Isi nomor juz.',true);if(f.hafalan.trim()===''||f.tilawah.trim()==='')return toast('Isi nilai hafalan dan tilawah.',true);
    const l=lama();const d={juz:f.juz,hafalan:f.hafalan,tilawah:f.tilawah,halaman:f.halaman,ganti:!!l};
    try{let r=await kirim(d);
      if(r.ada){if(!(await konfirmasi(`Juz ${f.juz} baru saja dinilai penguji lain. Ganti dengan nilai Antum?`)))return chips(),segar();r=await kirim(Object.assign(d,{ganti:true}))}
      toast(`Juz ${f.juz} ${r.aksi==='ubah'?'diperbarui':'tersimpan'} untuk ${sapaan(s).replace('Ananda ','')}.`);m.close();daftarUjian();
    }catch(_){}};
  $('[data-h]',ov).onclick=async()=>{if(!(await konfirmasi(`Hapus nilai ujian Juz ${f.juz} milik ${esc(s.nama)}?`,{ya:'Hapus',bahaya:true})))return;
    try{await kirim({juz:f.juz,hapus:true});toast('Nilai Juz '+f.juz+' dihapus.');m.close();daftarUjian()}catch(_){}};
  chips();isi();
  setTimeout(()=>{const t=edit?$o('#uj_haf'):(f.juz?$o('#uj_haf'):$o('#uj_juz'));t&&t.focus()},60);
}
function imporTahfizh(){
  const m=modal({lg:1,title:'Impor nilai tahfizh dari Excel',body:`<div class="note g" style="margin-bottom:14px">Salin tabel <b>beserta baris judulnya</b>. Satu baris = satu juz, jadi satu santri bisa beberapa baris.
    Judul yang dikenali: <b>Nama</b>, <b>Juz</b>, <b>Hafalan</b>/Hifzh, <b>Tilawah</b>, <b>Halaman</b> (opsional — kosong berarti 20/utuh). Juz yang sudah ada akan diperbarui, yang baru ditambahkan. Data langsung tersimpan.</div>
    <textarea class="in" id="tx" placeholder="Nama&#9;Juz&#9;Hafalan&#9;Tilawah&#9;Halaman"></textarea><div id="pv" style="margin-top:12px"></div>`,
    foot:`<span class="sp"></span><button class="btn btn-s" data-c>Batal</button><button class="btn btn-s" data-p>Periksa</button><button class="btn btn-p" data-s disabled>Simpan</button>`});
  let rows=null;
  const norm=x=>String(x||'').toLowerCase().replace(/^(muhammad|muhamad|moh\.?|m\.)\s+/,'').replace(/[^a-z]/g,'');
  const cari=n=>{const q=norm(n);if(!q)return null;let h=F.santri.filter(s=>norm(s.nama)===q);if(h.length===1)return h[0];
    h=F.santri.filter(s=>{const x=norm(s.nama);return x.indexOf(q)>=0||q.indexOf(x)>=0});return h.length===1?h[0]:null};
  $('[data-c]',m.ov).onclick=m.close;
  $('[data-p]',m.ov).onclick=()=>{const lines=$('#tx',m.ov).value.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(lines.length<2)return toast('Tempel baris judul dan data.',true);
    const h=lines[0].split('\t').map(x=>x.trim().toLowerCase());const ix={nama:h.findIndex(x=>/nama/.test(x)),juz:h.findIndex(x=>/^juz/.test(x)),haf:h.findIndex(x=>/hafal|hifz|hifdz/.test(x)),til:h.findIndex(x=>/tilaw/.test(x)),hal:h.findIndex(x=>/halaman|hlm/.test(x))};
    if(ix.nama<0||ix.juz<0)return toast('Kolom "Nama" dan "Juz" wajib ada di baris judul.',true);
    const per={},gagal=new Set();let last=null;
    lines.slice(1).forEach(l=>{const c=l.split('\t');let s=String(c[ix.nama]||'').trim()?cari(c[ix.nama]):last;if(String(c[ix.nama]||'').trim()&&!s){gagal.add(c[ix.nama].trim());last=null;return}if(!s)return;last=s;
      const j=String(c[ix.juz]||'').replace(/[^0-9]/g,'');if(!j)return;(per[s.id]=per[s.id]||[]).push({juz:j,hafalan:ix.haf>=0?(c[ix.haf]||'').trim():'',tilawah:ix.til>=0?(c[ix.til]||'').trim():'',halaman:ix.hal>=0&&String(c[ix.hal]||'').trim()?String(c[ix.hal]).replace(/[^0-9]/g,''):'20'})});
    rows=Object.keys(per).map(id=>{const x=F.data[id]||{};const lama=parseJuz(x.juz);per[id].forEach(n=>{const i=lama.findIndex(j=>+j.juz===+n.juz);n.penguji='';if(i>=0)lama[i]=Object.assign(lama[i],n);else lama.push(n)});
      return {santriId:id,juzAsal:x.juz||'',juz:lama,akhir:x.akhir||'',adab:x.adab||'',izin:x.izin||'',sakit:x.sakit||'',alpa:x.alpa||'',catatan:x.catatan||''}});
    const nJ=Object.values(per).reduce((a,c)=>a+c.length,0);
    $('#pv',m.ov).innerHTML=`<span class="pill">${rows.length} santri · ${nJ} juz</span>${gagal.size?` <span class="pill rd">${gagal.size} nama tidak ditemukan</span><div class="note" style="margin-top:8px">Tidak ditemukan di halaqah ini: ${esc([...gagal].join(', '))}</div>`:''}`;
    $('[data-s]',m.ov).disabled=!rows.length};
  $('[data-s]',m.ov).onclick=async()=>{if(await simpanF(rows)){m.close();renderTahfizh()}};
}

PAGES.nasrama=()=>{
  const me=S.d.me;const arr=((me.isAdmin||me.isKesantrian)?[...S.d.asrama]:S.d.asrama.filter(a=>a.musyrifId===me.id));
  if(!arr.length){$('#page').innerHTML='<div class="ph"><div><h1>Keasramaan</h1></div></div><div class="card empty">Anda belum tercatat sebagai musyrif asrama.</div>';return}
  if(!arr.some(a=>a.id===S.f.as)){const own=arr.find(a=>a.musyrifId===me.id);S.f.as=(own||arr[0]).id}
  $('#page').innerHTML=`<div class="ph"><div><h1>Keasramaan</h1><p>Penilaian 9 aspek keasramaan (A–D). Predikat, deskripsi, dan catatan dibuat otomatis.</p></div>
    <div class="act">${pilihGrup(arr,S.f.as,'pa',a=>a.nama+' · '+ust(a.musyrifId))}</div></div><div class="card" id="fc"><div class="empty"><div class="spin" style="margin:0 auto 10px"></div>Memuat…</div></div>`;
  if($('#pa'))$('#pa').onchange=async e=>{if(await bolehPergi()){S.f.as=e.target.value;muatAsrama()}else{e.target.value=S.f.as;segarkanPick(e.target)}};
  muatAsrama();
};
async function muatAsrama(){
  const gid=S.f.as;let r;try{r=await call('ambilForm',{jenis:'NilaiAsrama',grupId:gid},{silent:true})}catch(e){$('#fc').innerHTML='<div class="empty">Gagal memuat.</div>';return}
  if(gid!==S.f.as||S.page!=='nasrama')return;
  const map={};r.rows.forEach(x=>map[x.santriId]=x);
  const santri=santriAktif().filter(s=>s.asramaId===gid).sort((a,b)=>(K(a.kelasId).tingkat-K(b.kelasId).tingkat)||a.nama.localeCompare(b.nama));
  F={page:'nasrama',jenis:'NilaiAsrama',grupId:gid,data:map,dirty:false,santri,
    rows:santri.map(s=>{const x=map[s.id]||{};return {s,a:[1,2,3,4,5,6,7,8,9].map(i=>x['a'+i]||''),catatan:x.catatan||''}})};
  tandaPantau(A(gid).musyrifId);renderAsrama();
}
function renderAsrama(){
  if(HP())return renderAsramaHP();
  const a=A(F.grupId),bisa=S.d.me.isAdmin||a.musyrifId===S.d.me.id;const cols=[1,2,3,4,5,6,7,8,9].map(i=>'a'+i);
  $('#fc').innerHTML=`<div class="card-h" style="flex-wrap:wrap"><div><h3>${esc(a.nama)}</h3><div style="color:var(--ink3);font-size:12.5px;margin-top:3px">Musyrif: ${esc(ust(a.musyrifId))} · ${F.santri.length} santri</div></div>
    <div style="display:flex;gap:10px;align-items:center"><span class="pill" id="gpr"></span><span class="save-st" id="sst"></span>${bisa?`<button class="btn btn-p" id="sv">${ic('save')}Simpan</button>`:''}</div></div>
    ${bisa?'<div style="padding:10px 18px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink3)">Ketik A / B / C / D. Bisa juga salin beberapa kolom huruf dari Excel lalu tempel di sel pertama. Enter pindah ke bawah.</div>':''}
    <div class="tw" style="max-height:70vh"><table class="gt" id="ag"><thead><tr><th rowspan="2">No</th><th rowspan="2" class="nmc">Nama santri</th>${GRUP_ASPEK.map(g=>`<th colspan="${g[1]}" class="grp">${g[0]}</th>`).join('')}<th rowspan="2">Predikat</th><th rowspan="2">Catatan musyrif</th><th rowspan="2"></th></tr>
      <tr>${ASPEK.map((x,i)=>`<th title="${esc(x[0])}" style="top:34px">${i+1}<div style="font-weight:500;font-size:10px;max-width:60px;white-space:normal;line-height:1.1">${esc(x[0])}</div></th>`).join('')}</tr></thead><tbody>
    ${F.rows.map((x,i)=>`<tr><td class="num">${i+1}</td><td class="nmc"><b style="font-weight:600">${esc(x.s.nama)}</b><div style="font-size:11.5px;color:var(--ink3)">${esc(K(x.s.kelasId).nama)}</div></td>
      ${x.a.map((v,j)=>`<td><input class="gi ad" data-r="${i}" data-c="a${j+1}" value="${esc(v)}" maxlength="1" ${bisa?'':'disabled'}></td>`).join('')}
      <td id="pd${i}" style="font-weight:700;padding:3px 12px;min-width:92px"></td><td style="text-align:left;white-space:normal;min-width:220px;max-width:300px;font-size:12.5px"><span id="ct${i}" style="font-style:italic;color:var(--ink2)"></span>${bisa?` <button class="btn btn-g btn-sm" data-uc="${i}" style="padding:2px 6px">Ubah</button>`:''}</td><td><span class="st-dot" id="sd${i}"></span></td></tr>`).join('')}
    </tbody></table></div>`;
  F.rows.forEach((x,i)=>barisAsrama(i));hitungAsrama();
  pasangGrid($('#ag'),cols,(r,c,v,el)=>{v=v.toUpperCase().trim();if(el.value!==v)el.value=v;el.classList.toggle('bad',!['','A','B','C','D'].includes(v));F.rows[r].a[+c.slice(1)-1]=v;F.dirty=true;barisAsrama(r);hitungAsrama()});
  if(!bisa)return;
  $$('[data-uc]').forEach(b=>b.onclick=()=>{const i=+b.dataset.uc,x=F.rows[i];ubahCatatan('Catatan musyrif asrama · '+x.s.nama,catatanAsrama(x.s,x.a),x.catatan,v=>{x.catatan=v;F.dirty=true;barisAsrama(i);hitungAsrama()})});
  $('#sv').onclick=async()=>{if($('#ag .bad'))return toast('Isi huruf A, B, C, atau D.',true);
    if(await simpanF(F.rows.map(x=>{const o={santriId:x.s.id,catatan:x.catatan};x.a.forEach((v,j)=>o['a'+(j+1)]=v);return o}))){hitungAsrama()}};
}
function barisAsrama(i){const x=F.rows[i];const isi=x.a.filter(v=>NHUR[v]);
  const hur=isi.length?hurufRata(isi.reduce((a,c)=>a+NHUR[c],0)/isi.length):'';
  $('#pd'+i).innerHTML=isi.length===9?`${PRED_HURUF[hur]}`:(isi.length?`<span style="color:var(--ink3);font-weight:500">${isi.length}/9</span>`:'—');
  const auto=catatanAsrama(x.s,x.a);$('#ct'+i).textContent=x.catatan?potong(x.catatan)+' (manual)':auto?potong(auto):'—';
  $('#sd'+i).className='st-dot'+(isi.length===9?' ok':isi.length?' half':'')}
function hitungAsrama(){$('#gpr').textContent=`${F.rows.filter(x=>x.a.every(v=>NHUR[v])).length}/${F.rows.length} lengkap`;statusSimpan()}

PAGES.wali=()=>{

  if(!arr.length){$('#page').innerHTML='<div class="ph"><div><h1>Wali Kelas</h1></div></div><div class="card empty">Anda belum tercatat sebagai wali kelas.</div>';return}
  if(!arr.some(k=>k.id===S.f.wk)){const own=arr.find(k=>k.waliId===me.id);S.f.wk=(own||arr[0]).id}

    <div class="act">${pilihGrup(arr,S.f.wk,'pk',k=>k.nama)}</div></div><div class="card" id="fc"><div class="empty"><div class="spin" style="margin:0 auto 10px"></div>Memuat…</div></div>`;

  const kid=S.f.wk;let r;try{r=await call('rekapKelas',{kelasId:kid},{silent:true})}catch(e){$('#fc').innerHTML='<div class="empty">Gagal memuat.</div>';return}
  if(kid!==S.f.wk||S.page!=='wali')return;
  const hk=hitungKelas(kid,r);const map={};(r.wali||[]).forEach(x=>map[x.santriId]=x);
  F={page:'wali',jenis:'RaporWali',grupId:kid,data:map,dirty:false,hk,
    rows:hk.data.map(x=>{const w=map[x.s.id]||{};return {x,s:x.s,izin:w.izin||'',sakit:w.sakit||'',alpa:w.alpa||'',catatan:w.catatan||''}})};
  renderWali();
}

function gambarCetak(){
  if(!CT)return;const f=S.f,hk=CT.hk;$('#cs').value=f.cs;

    if(f.cj==='semua'||f.cj==='tahfizh'){const t=CT.th[x.s.id];if(!t||!t.juz)m.push('tahfizh')}
    if(f.cj==='semua'||f.cj==='asrama'){const a=CT.as[x.s.id];if(!a||[1,2,3,4,5,6,7,8,9].some(i=>!a['a'+i]))m.push('asrama')}

     <div class="scard"><div style="display:flex;align-items:center;gap:12px"><div class="av" style="width:46px;height:46px;font-size:18px">${inisial(x.s.nama)}</div><div style="min-width:0;flex:1"><b style="font-size:17px;line-height:1.25;display:block">${esc(x.s.nama)}</b><span style="font-size:13px;color:var(--ink3)">Santri ${i+1} dari ${g.rows.length}</span></div>
      <button type="button" id="gis" class="ibtn" aria-label="Pilih santri">${ic('users')}</button></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${x.tugas.map((v,j)=>fld('t'+j,'Tugas '+(j+1))).join('')}${bisa?`<button type="button" class="btn" data-col="+" style="margin-top:22px;height:54px;border:1.5px dashed var(--line);color:var(--ink3);background:transparent">${ic('plus')}Tugas</button>`:''}</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${fld('pts','PTS')}${fld('pas','PAS')}</div>
      <div class="hlab">Adab di kelas<div class="abcd wide" id="gad">${['A','B','C','D'].map(h=>`<button type="button" data-ad="${h}" class="${x.adab===h?'on':''}" ${bisa?'':'disabled'}>${h}</button>`).join('')}</div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--g0);border-radius:14px;padding:12px 14px"><div><div style="font-size:13px;color:var(--ink3)">Nilai akhir</div><div style="font-size:12px;margin-top:2px" id="hsk"></div></div><div id="hsn" style="font-size:30px;font-weight:800"></div></div></div>`;
  }
  $('#grid').innerHTML=`<div style="padding:0">${head}${body}</div>${bar}`;
  $('#grid').style.cssText='background:transparent;border:0;box-shadow:none';
  g.rows.forEach((x,i)=>perbaruiBarisHP(i,hitungNA(x)));perbaruiStatus();
  $$('[data-md]').forEach(bt=>bt.onclick=()=>{S.f.gmode=bt.dataset.md;renderGridHP()});
  $$('[data-col]').forEach(bt=>bt.onclick=()=>{if(bt.dataset.col==='+'){g.nT++;g.rows.forEach(x=>x.tugas.push(''));g.dirty=true;S.f.gcol='t'+(g.nT-1);}else S.f.gcol=bt.dataset.col;renderGridHP();const f=$('#grid .gi');if(f&&mode==='kolom'&&bt.dataset.col==='+')f.focus()});
  const set=(r,c,v,el)=>{aturSel(r,c,v,el);g.dirty=true;perbaruiStatus()};
  if(mode==='kolom'){pasangGrid($('#gl'),[S.f.gcol],set)}
  else{const cols=g.cols.filter(c=>c!=='adab');pasangGrid($('#grid .scard'),cols,set);
    $('#grid .scard').addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.classList.contains('gi'))return;const ins=$$('#grid .scard .gi');const k=ins.indexOf(e.target);e.preventDefault();if(ins[k+1])ins[k+1].focus();else e.target.blur()});
    $$('#gad [data-ad]').forEach(bt=>bt.onclick=()=>{const v=g.rows[S.f.gi].adab===bt.dataset.ad?'':bt.dataset.ad;aturSel(S.f.gi,'adab',v,null);g.dirty=true;$$('#gad [data-ad]').forEach(z=>z.classList.toggle('on',z.dataset.ad===v));perbaruiStatus()});
    $('#gis').onclick=()=>bukaSheet({judul:'Pilih santri',cari:g.rows.length>10,nilai:String(S.f.gi),opsi:g.rows.map((y,j)=>{const h=hitungNA(y);return {v:String(j),t:(j+1)+'. '+y.s.nama,s:h.na==null?'Belum ada nilai':'Nilai akhir '+h.rapor+(h.lengkap?' · lengkap':' · sementara')}}),pilih:v=>{S.f.gi=+v;renderGridHP();window.scrollTo(0,0)}})}
  if(!bisa)return;
  if($('#hk'))$('#hk').onclick=async()=>{const j=+S.f.gcol.slice(1);const ada=g.rows.some(x=>String(x.tugas[j]).trim()!=='');
    if(ada&&!await konfirmasi(`Kolom T${j+1} berisi nilai. Hapus kolom beserta nilainya?`,{ya:'Hapus kolom',bahaya:1}))return;g.nT--;g.rows.forEach(x=>x.tugas.splice(j,1));g.dirty=true;S.f.gcol='pts';renderGridHP()};
  if($('#ix'))$('#ix').onclick=imporNilai;
  if($('#sv'))$('#sv').onclick=simpanGrid;
  if($('#sn'))$('#sn').onclick=async()=>{if(g.dirty)await simpanGrid();if(g.dirty)return;if(S.f.gi<g.rows.length-1){S.f.gi++;renderGridHP();window.scrollTo(0,0)}else toast('Ini santri terakhir.')};
  if($('#sp'))$('#sp').onclick=()=>{if(S.f.gi>0){S.f.gi--;renderGridHP();window.scrollTo(0,0)}};
}
function perbaruiBarisHP(i,h){
  const b=BOBOT(),x=G.rows[i];
  const el=$('#hs'+i);if(el){el.innerHTML=h.na==null?'Belum ada nilai':`Nilai akhir <b style="color:${h.rapor<b.kkm?'var(--rd)':'var(--ink)'}">${h.rapor}${h.katrol?'*':''}</b>${h.lengkap?' · lengkap':' · sementara'}`}
  if((S.f.gmode||'kolom')==='santri'&&i===S.f.gi&&$('#hsn')){$('#hsn').textContent=h.na==null?'—':h.rapor+(h.katrol?'*':'');$('#hsn').style.color=h.na==null?'var(--ink3)':h.rapor<b.kkm?'var(--rd)':h.lengkap?'var(--g8)':'var(--ink3)';
    const kurang=[];if(h.rt==null)kurang.push('tugas');if(String(x.pts).trim()==='')kurang.push('PTS');if(String(x.pas).trim()==='')kurang.push('PAS');if(!x.adab)kurang.push('adab');
    $('#hsk').innerHTML=kurang.length?`<span style="color:var(--or)">Belum: ${kurang.join(', ')}</span>`:'<span style="color:var(--g6)">Lengkap</span>'}
}

function renderTahfizhHP(){
  const h=H(F.grupId),bisa=S.d.me.isAdmin||h.musyrifId===S.d.me.id;
  const santri=santriAktif().filter(s=>s.halaqahId===F.grupId).sort((a,b)=>(K(a.kelasId).tingkat-K(b.kelasId).tingkat)||a.nama.localeCompare(b.nama));
  F.santri=santri;let lengkap=0;
  const it=santri.map(s=>{const x=F.data[s.id]||{};const t=hitungTahfizh(parseJuz(x.juz));const ok=t.rows.length&&x.akhir&&x.adab;if(ok)lengkap++;const c=fmtJuz(t.capaian);
    return `<div class="it" data-s="${s.id}"><span class="st-dot ${ok?'ok':t.rows.length||x.adab?'half':''}"></span><div style="flex:1;min-width:0"><b style="font-size:15px;font-weight:600;display:block">${esc(s.nama)}</b>
     <span style="font-size:12.5px;color:var(--ink3)">${esc(K(s.kelasId).nama)}${t.rows.length?` · ${c.dec} juz · rata-rata ${t.rata!=null?fmt1(t.rata):'—'}`:' · belum diisi'}</span></div>${ic('next','width="18" height="18" style="color:var(--ink3)"')}</div>`}).join('');
  $('#fc').innerHTML=`<div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><b>${esc(h.nama)}</b><div style="font-size:12.5px;color:var(--ink3)">${santri.length} santri · ketuk nama untuk mengisi</div></div>
   <div style="display:flex;gap:6px;align-items:center"><span class="pill">${lengkap}/${santri.length}</span>${bisa?`<button class="btn btn-s btn-sm" id="ixt">${ic('up')}Tempel</button>`:''}</div></div>
   <div class="mlistc" style="border-radius:0;border-left:0;border-right:0">${it||'<div class="empty">Belum ada santri.</div>'}</div>`;
  $$('#fc .it').forEach(el=>el.onclick=()=>editTahfizh(byId(S.d.santri,el.dataset.s),bisa));
  if(bisa)$('#ixt').onclick=imporTahfizh;
}

function renderAsramaHP(){
  const a=A(F.grupId),bisa=S.d.me.isAdmin||a.musyrifId===S.d.me.id;
  let i=S.f.ai||0;if(i>=F.rows.length)i=F.rows.length-1;if(i<0)i=0;S.f.ai=i;const x=F.rows[i];
  if(!x){$('#fc').innerHTML='<div class="empty">Belum ada santri di asrama ini.</div>';return}
  let n=0;const AR={A:'ممتاز',B:'جيّد جدّا',C:'جيّد',D:'مقبول'};
  const blok=GRUP_ASPEK.map(gr=>{const rows=ASPEK.slice(n,n+gr[1]).map((asp,j)=>{const idx=n+j;return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-top:1px solid var(--line)"><div style="font-size:14.5px;font-weight:600;min-width:0">${asp[0]}</div>
     <div class="abcd" data-asp="${idx}">${['A','B','C','D'].map(h=>`<button type="button" data-v="${h}" class="${x.a[idx]===h?'on':''}" ${bisa?'':'disabled'} aria-label="${asp[0]} ${h}">${h}</button>`).join('')}</div></div>`}).join('');n+=gr[1];
    return `<div class="mlistc" style="margin-bottom:12px"><div style="padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.4px;background:var(--g0)">${gr[0].toUpperCase()}</div>${rows}</div>`}).join('');
  const isi=x.a.filter(v=>NHUR[v]).length;
  $('#fc').innerHTML=`<div style="padding:14px 16px 4px"><div class="dots" style="margin-bottom:12px">${F.rows.map((y,j)=>`<i class="${j===i?'cur':y.a.every(v=>NHUR[v])?'ok':''}"></i>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="av" style="width:44px;height:44px">${inisial(x.s.nama)}</div><div style="flex:1;min-width:0"><b style="font-size:16px;display:block;line-height:1.25">${esc(x.s.nama)}</b><span style="font-size:12.5px;color:var(--ink3)">${esc(K(x.s.kelasId).nama)} · santri ${i+1} dari ${F.rows.length}</span></div>
    <span class="pill ${isi===9?'':'au'}" id="gpr">${isi}/9</span></div>${blok}
    <div class="card" style="padding:12px 14px;margin-bottom:12px"><div style="font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px">Catatan musyrif ${x.catatan?'(manual)':'(otomatis)'}</div><div id="act" style="font-style:italic;font-size:13.5px;line-height:1.55;color:var(--ink2)"></div>${bisa?'<button class="btn btn-g btn-sm" id="auc" style="margin-top:6px;padding:4px 6px">Ubah catatan</button>':''}</div></div>
    ${bisa?`<div class="hpbar"><span class="save-st" id="sst" style="flex:1"></span><button class="btn btn-s" id="sp" aria-label="Santri sebelumnya" style="width:54px;padding:0">${ic('back')}</button><button class="btn btn-p" id="sn" style="flex:1.4">Simpan &amp; lanjut ${ic('next')}</button></div>`:''}`;
  const tulisCat=()=>{$('#act').textContent=x.catatan||catatanAsrama(x.s,x.a)||'Lengkapi 9 aspek untuk catatan otomatis.'};tulisCat();statusSimpan();
  if(!bisa)return;
  $$('[data-asp] [data-v]').forEach(bt=>bt.onclick=()=>{const idx=+bt.parentNode.dataset.asp;const v=x.a[idx]===bt.dataset.v?'':bt.dataset.v;x.a[idx]=v;F.dirty=true;
    $$('[data-v]',bt.parentNode).forEach(z=>z.classList.toggle('on',z.dataset.v===v));const k=x.a.filter(q=>NHUR[q]).length;$('#gpr').textContent=k+'/9';$('#gpr').className='pill '+(k===9?'':'au');tulisCat();statusSimpan()});
  $('#auc').onclick=()=>ubahCatatan('Catatan musyrif asrama · '+x.s.nama,catatanAsrama(x.s,x.a),x.catatan,v=>{x.catatan=v;F.dirty=true;renderAsramaHP()});
  const simpanSemua=()=>simpanF(F.rows.map(r=>{const o={santriId:r.s.id,catatan:r.catatan};r.a.forEach((v,j)=>o['a'+(j+1)]=v);return o}));
  $('#sn').onclick=async()=>{if(F.dirty&&!(await simpanSemua()))return;if(S.f.ai<F.rows.length-1){S.f.ai++;renderAsramaHP();window.scrollTo(0,0)}else{renderAsramaHP();toast('Ini santri terakhir.')}};
  $('#sp').onclick=()=>{if(S.f.ai>0){S.f.ai--;renderAsramaHP();window.scrollTo(0,0)}};
}

function renderWaliHP(){
  const k=K(F.grupId),bisa=S.d.me.isAdmin||k.waliId===S.d.me.id,cols=['izin','sakit','alpa'],sat=satuanAbsen().id;
  $('#fc').innerHTML=`<div style="padding:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:14px">Absensi diniyah</b><span class="pill" id="gpr"></span></div><div style="font-size:12.5px;color:var(--ink3);margin-top:4px;line-height:1.5">Jumlah ${sat==='sesi'?'sesi/pertemuan':'hari'}. Isi 0 bila tidak pernah.</div></div>
   <div id="wl">${F.rows.map((r,i)=>`<div class="wrow">
     <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div style="min-width:0"><b style="font-size:15px;font-weight:600">${esc(r.s.nama)}</b><div style="font-size:12.5px;color:var(--ink3);margin-top:2px">Rata-rata ${r.x.rata!=null?fmt1(r.x.rata):'—'}${r.x.rank?` · peringkat ${r.x.rank}`:''}${r.x.adab?` · adab ${r.x.adab}`:''}</div></div><span class="st-dot" id="sd${i}" style="margin-top:6px"></span></div>
     <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px">${cols.map(c=>`<label class="hlab" style="font-size:12px">${{izin:'Izin',sakit:'Sakit',alpa:'Tanpa ket.'}[c]}<input class="gi hpw" style="height:46px;font-size:18px" data-r="${i}" data-c="${c}" value="${esc(r[c])}" inputmode="numeric" enterkeyhint="next" placeholder="—" ${bisa?'':'disabled'}></label>`).join('')}</div>
     <div class="wcat"><span id="ct${i}"></span>${bisa?`<button type="button" data-uc="${i}">Ubah</button>`:''}</div></div>`).join('')}</div>
   ${bisa?`<div class="hpbar"><span class="save-st" id="sst" style="flex:1"></span><button class="btn btn-p" id="sv" style="padding:0 26px">${ic('save')}Simpan</button></div>`:''}`;
  F.rows.forEach((r,i)=>barisWali(i));hitungWali();
  pasangGrid($('#wl'),cols,(r,c,v,el)=>{el.classList.toggle('bad',!(v.trim()===''||v.trim()==='-'||/^\d+$/.test(v.trim())));F.rows[r][c]=v.trim();F.dirty=true;barisWali(r);hitungWali()});
  if(!bisa)return;
  $$('[data-uc]').forEach(b=>b.onclick=()=>{const i=+b.dataset.uc,r=F.rows[i];ubahCatatan('Catatan wali kelas · '+r.s.nama,catatanWali(r.s,r.x),r.catatan,v=>{r.catatan=v;F.dirty=true;barisWali(i);hitungWali()})});
  $('#sv').onclick=async()=>{if($('#wl .bad'))return toast('Absensi diisi angka jumlah.',true);if(await simpanF(F.rows.map(r=>({santriId:r.s.id,izin:r.izin,sakit:r.sakit,alpa:r.alpa,catatan:r.catatan}))))hitungWali()};
}

PAGES.pengaturan=()=>{
  const st=S.d.pengaturan,inp=(k,l,t='text',x='')=>`<div class="f"><label>${l}</label><input class="in ${x}" name="${k}" type="${t}" ${t==='number'?'step="any"':''} ${x==='ar'?'dir="rtl"':''} value="${esc(st[k])}"></div>`;
  $('#page').innerHTML=`<div class="ph"><div><h1>Pengaturan</h1><p>Identitas lembaga, semester aktif, dan aturan penilaian.</p></div><div class="act"><button class="btn btn-p" id="sv">${ic('check')}Simpan pengaturan</button></div></div>
  <div id="fp" class="cols c2">
   <div class="card"><div class="card-h"><h3>Semester aktif</h3></div><div class="card-b">
    <div class="grid2">${inp('tahunAjaran','Tahun ajaran')}<div class="f"><label>Semester</label><select class="in" name="semester"><option ${st.semester==='Ganjil'?'selected':''}>Ganjil</option><option ${st.semester==='Genap'?'selected':''}>Genap</option></select></div></div>
    <div class="grid2">${inp('tanggalRapor','Tanggal penyusunan rapor','date')}<div class="f"><label>Mudir</label><select class="in" name="mudirId">${ustOpsi(st.mudirId)}</select></div></div>
    <div class="f"><label>Satuan absensi diniyah</label><select class="in" name="satuanAbsenDiniyah"><option value="sesi" ${st.satuanAbsenDiniyah!=='hari'?'selected':''}>Per sesi / pertemuan</option><option value="hari" ${st.satuanAbsenDiniyah==='hari'?'selected':''}>Per hari</option></select><small>Tercetak di rapor diniyah, mis. "Sakit: 3 sesi".</small></div><div class="f"><label>Satuan absensi halaqah tahfizh</label><select class="in" name="satuanAbsenTahfizh"><option value="sesi" ${st.satuanAbsenTahfizh!=='hari'?'selected':''}>Per sesi halaqah</option><option value="hari" ${st.satuanAbsenTahfizh==='hari'?'selected':''}>Per hari</option></select><small>Tercetak di rapor tahfizh, mis. "Izin: 2 sesi".</small></div>
    <div class="note g">Semester <b>Genap</b> akan menampilkan keputusan kenaikan kelas di rapor diniyah; semester <b>Ganjil</b> tidak.</div>
   </div></div>
   <div class="card"><div class="card-h"><h3>Aturan nilai</h3></div><div class="card-b">
    <div class="grid2">${inp('kkm','KKM','number')}${inp('batasKatrol','Nilai minimum tampil (katrol)','number')}</div>
    <div class="grid3">${inp('bobotTugas','Bobot tugas (%)','number')}${inp('bobotPTS','Bobot PTS (%)','number')}${inp('bobotPAS','Bobot PAS (%)','number')}</div>
    <div class="note">Nilai akhir di bawah ${esc(st.batasKatrol)} ditampilkan ${esc(st.batasKatrol)} di rapor (nilai asli tetap tersimpan). Nilai ${esc(st.batasKatrol)}–${+st.kkm-1} tampil apa adanya dan berstatus Belum Tercapai.</div>
   </div></div>
   <div class="card"><div class="card-h"><h3>Batas predikat (nilai minimal)</h3></div><div class="card-b">
    <div class="grid2">${inp('batasIstimewa','Istimewa · ممتاز','number')}${inp('batasBaikSekali','Baik Sekali · جيد جدا','number')}${inp('batasBaik','Baik · جيد','number')}${inp('batasCukup','Cukup · مقبول','number')}</div>
    <small style="color:var(--ink3)">Di bawah batas Cukup = Rasib (راسب). Bawaan: Maqbul 70 · Jayyid 78 · Jayyid Jiddan 86 · Mumtaz 93. Huruf A–D (adab & asrama): A ≥ 3,5 · B ≥ 2,5 · C ≥ 1,5 · D.</small>
   </div></div>
   <div class="card"><div class="card-h"><h3>Identitas lembaga (kop rapor)</h3></div><div class="card-b">
    ${inp('namaLembaga','Nama lembaga')}${inp('namaLembagaAr','Nama lembaga (Arab)','text','ar')}${inp('alamat','Alamat')}
    <div class="grid2">${inp('kota','Kota (tempat tanda tangan)')}${inp('kotaAr','Kota (Arab)','text','ar')}</div>
   </div></div>
  </div>`;
  $('#sv').onclick=async()=>{try{const r=await call('simpanPengaturan',nilaiForm($('#fp')));S.d.pengaturan=r;toast('Pengaturan tersimpan.');ulang()}catch(_){}};
};


PAGES.akun=()=>{
  const me=S.d.me,u=byId(S.d.ustadz,me.id)||me;
  $('#page').innerHTML=`<div class="ph"><div><h1>Akun Saya</h1><p>Profil dan keamanan akun.</p></div></div>
  <div class="cols c2">
   <div class="card"><div class="card-b" style="display:flex;gap:16px;align-items:center"><div class="av" style="width:56px;height:56px;font-size:22px">${inisial(u.nama)}</div>
    <div><b style="font-size:17px">Ustadz ${esc(u.nama)}</b>${u.namaAr?`<div class="ar" style="font-size:18px">الأستاذ ${esc(u.namaAr)}</div>`:''}<div style="color:var(--ink3);margin-top:4px" class="mono">@${esc(u.username)}</div></div></div>
    <div class="card-b" style="border-top:1px solid var(--line)">${peranUstadz(me.id)||'<span style="color:var(--ink3)">Belum ada peran.</span>'}</div>
    <div class="card-b" style="border-top:1px solid var(--line)"><button class="btn btn-s" id="bkAkun">${ic('out')}Keluar</button></div></div>
   <div class="card"><div class="card-h"><h3>Ganti sandi</h3></div><form class="card-b" id="fg">${formSandi()}<button class="btn btn-p">Simpan sandi baru</button></form></div>
  </div>`;
  $('#fg').onsubmit=async e=>{e.preventDefault();await kirimSandi(e.target)};
  $('#bkAkun').onclick=keluar;
};

  if(!S.token)return renderLogin();
  try{S.d=await call('boot',{},{silent:true});mulai();}catch(e){if(!S.d)renderLogin();}
})();
